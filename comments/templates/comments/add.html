{% extends "basic.html" %}

{% block content %}
<h1>Add comment</h1>

<form method="post">
  {% csrf_token %}
  {% for field in form %}
    <div class="form-group">
      <label for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
      {% if field.errors %}
        <ul class="messages">
          {% for error in field.errors %}
            <li>{{ error }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    </div>
  {% endfor %}
  <input type="submit" value="Send" />
  <a href="{% url 'posts:post-detail' post.slug %}" class="cancel">Cancel</a>
</form>
{% endblock %}
