{% extends "basic.html" %}

{% block content %}
<h1>Edit Profile</h1>

<form method="post" enctype="multipart/form-data">
  {% csrf_token %}
  {% for field in form %}
    <div class="form-group">
      <label for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
      {% if field.errors %}
        <ul class="messages">
          {% for error in field.errors %}
            <li>{{ error }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    </div>
  {% endfor %}
  <input type="submit" value="Save" />
  <a href="{% url 'users:profile-detail' username=request.user.username %}" class="cancel">Cancel</a>
</form>
{% endblock %}
