{% load static %}
<header>
  <div class="header-left">
    <a href="{% url 'index' %}" class="logo"><img src="{% static 'logo.png' %}" alt="Logo tribu" /></a>
    <a href="{% url 'posts:post-list' %}" class="nav-link">Posts</a>
    <a href="{% url 'users:users-list' %}" class="nav-link">Users</a>


  </div>

  <div class="header-right">
    {% if not hide_links %}
      {% if user.is_authenticated %}
        <a href="{% url 'users:profile-detail' username=user.username %}" class="username">{{ user.username }}</a>
        <a href="{% url 'logout' %}" class="logout">Logout</a>
      {% else %}
        <a href="{% url 'login' %}" class="login">Login</a>
        <a href="{% url 'signup' %}" class="signup">Sign up</a>
      {% endif %}
    {% endif %}
  </div>
</header>
