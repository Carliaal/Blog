{% extends "basic.html" %}

{% block content %}
<div class="post-detail">

  <div class="post-detail-topbar">
    <a href="{% url 'posts:post-list' %}" class="show">← Back</a>
  </div>

  <div class="post-detail-card">
    <div class="post-detail-card-header">
      <h1>{{ post.title }}</h1>
      <p class="post-detail-date">{{ post.created_at|date:"d M Y · H:i" }}</p>
    </div>
    <div class="post-detail-divider"></div>
    <div class="post-detail-body">
      <p>{{ post.content }}</p>
    </div>
    <div class="post-detail-divider"></div>
    <div class="post-detail-footer">
      <a href="{% url 'posts:post-edit' post.slug %}" class="edit">Edit</a>
      <a href="{% url 'posts:post-delete' post.slug %}" class="delete">Delete</a>
    </div>
  </div>

</div>
{% endblock %}
